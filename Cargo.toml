[workspace]
resolver = "2"
members = ["yara-types", "hitomi"]

[workspace.package]
license = "MIT"
edition = "2021"
repository = "https://github.com/conor-sometimes/yara-sensor"

# Dependency policy (README "Dependencies"), the mimi policy verbatim: every dep is audit surface,
# justified against the cost of auditing its whole tree. The wire-types crate needs only serde +
# serde_json to render and parse the `yara/1` line. The engine crate (hitomi) adds yara-x (the
# scanner), sha2 (the file hash, already in yara-x's tree), and anyhow (error context) -- and
# nothing else (design section 8.1); libc joins when the fanotify daemon lands (step 4). Exact pins
# (`=x.y.z`), Cargo.lock committed, so the whole tree is deterministic; cargo-deny gates it
# (`just deny`, which also checks fuzz/Cargo.toml) and Dependabot proposes bumps as PRs.
[workspace.dependencies]
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }
# `pulley` routes rule evaluation through the wasmtime interpreter (no JIT, no W^X page), which is
# what lets the sensor run under MemoryDenyWriteExecute=yes (design 2.2). default features stay on
# for `default-modules`; `magic-module` is not a default and is never enabled.
yara-x = { version = "=1.22.1", features = ["pulley"] }
sha2 = "=0.11.1"
anyhow = "=1.0.104"
# The fanotify daemon's only new dependency: three syscalls and a struct of Linux uapi (design 8.1).
# Already in yara-x's tree, so it adds no new audit surface. Used on Linux targets only (the daemon
# is cfg(target_os = "linux")).
libc = "=0.2.191"

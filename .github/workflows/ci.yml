name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to commit SHAs (a tag is mutable; a SHA is the artifact). Dependabot's
# github-actions updater keeps them current, bumping the SHA and the trailing version comment.
jobs:
  # The gate: fmt, clippy, unit tests across the workspace (the wire schema and the engine), on
  # stable (rust-toolchain.toml). The sensor is an ordinary stable crate, so unlike mimi the engine
  # is linted and tested here rather than behind a flake-only job; the hermetic `nix build` below
  # is the belt-and-braces check.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the pinned toolchain
        run: rustup show
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: listener-charter gate
        # hitomi is listener-only: fail if a permission class or _PERM mask appears in code (design
        # 3.2). The written counterpart of mimi's bpf_send_signal ban.
        run: bash ci/listener-charter-gate.sh
      - name: test
        run: cargo test --workspace

  # The wire-types crate builds and tests hermetically through the flake (fenix stable + crane).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: build the wire-types crate
        run: nix build .#yara-types

  # Supply chain: advisories, licenses, sources (deny.toml), for the main tree and the fuzz crate
  # (its own workspace -- the instrumented build is under the same gate).
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: fuzz/Cargo.toml

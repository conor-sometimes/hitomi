name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to commit SHAs (a tag is mutable; a SHA is the artifact). Dependabot's
# github-actions updater keeps them current, bumping the SHA and the trailing version comment.
jobs:
  # The wire-schema gate: fmt, clippy, unit tests, on stable (rust-toolchain.toml). The sensor is an
  # ordinary stable crate, so unlike mimi there is no separate eBPF/flake build job -- a hermetic
  # `nix build` is the belt-and-braces check below.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the pinned toolchain
        run: rustup show
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy -p yara-types --all-targets -- -D warnings
      - name: test
        run: cargo test -p yara-types

  # The crate builds and tests hermetically through the flake (fenix stable + crane).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: build the wire-types crate
        run: nix build .#yara-types

  # Supply chain: advisories, licenses, sources (deny.toml).
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
